{% extends "base.html" %}

{% block title %} {{ title }} {% endblock %}

{% block app_content %}

<style>

.dt-right {
    text-align: right !important;
}

.positioning-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ─── Data-bar cell (Total Equity % column) ─────────────────────────── */
.bar-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 22px;
    overflow: hidden;
}

.bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    z-index: 0;
    transition: width 0.3s ease;
    /* colour is set inline per column */
}

.bar-label {
    position: relative;
    z-index: 1;
    font-weight: 500;
    font-size: 0.85rem;
}

/* ─── General table polish ───────────────────────────────────────────── */
.prime-datatable thead th {
    background-color: #002855;
    color: #fff;
    font-size: 0.80rem;
    white-space: nowrap;
    vertical-align: middle;
    border-bottom: 2px solid #4a5568;
}

.prime-datatable tbody tr:nth-child(even) {
    background-color: #f7f8fa;
}

.prime-datatable tbody tr:hover {
    background-color: #edf2f7 !important;
}

.prime-datatable tbody td {
    font-size: 0.83rem;
    vertical-align: middle;
    padding: 5px 8px;
}

.prime-datatable {
    border-collapse: collapse;
}

.prime-datatable tbody td,
.prime-datatable thead th {
    border: 1px solid #dee2e6;
}

/* ─── Clickable fund code ────────────────────────────────────────────── */
.fund-link {
    color: var(--bs-link-color, #0d6efd);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 600;
}
.fund-link:hover {
    opacity: 0.75;
}

/* ─── Fund detail modal – exposure bar rows ──────────────────────────── */
.fund-modal-metrics {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 6px;
}

.fund-modal-metric-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    align-items: center;
    gap: 12px;
}

.fund-modal-metric-label {
    font-size: 0.82rem;
    font-weight: 500;
    text-align: right;
    color: #4a5568;
    white-space: nowrap;
}

.fund-modal-bar-wrap {
    position: relative;
    height: 22px;
    background: #eef0f2;
    border-radius: 3px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.fund-modal-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    z-index: 0;
}

.fund-modal-bar-value {
    position: relative;
    z-index: 1;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0 8px;
}

</style>

<div class="container">
    <br>
    <h1 class="prime-h1">Equity Portfolio Monitor</h1>

    <!-- Shared date picker – sits above all tabs -->
    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
        <input type="date" class="form-control" value="{{p_val_date}}"
               id="valuation_date" name="valuation_date"
               style="width:200px;" required onchange="reloadActiveTab()">
    </div>

    <!-- Five top-level tabs -->
    <ul class="nav f-nav-tabs nav-justified" id="mainTabs">
        <li class="nav-item">
            <a class="f-nav-link active" data-bs-toggle="tab"
               data-bs-target="#tab-equity-exposure">Equity Exposure</a>
        </li>
        <li class="nav-item">
            <a class="f-nav-link" data-bs-toggle="tab"
               data-bs-target="#tab-cover">Cover</a>
        </li>
        <li class="nav-item">
            <a class="f-nav-link" data-bs-toggle="tab"
               data-bs-target="#tab-alpha">Alpha Expectations</a>
        </li>
        <li class="nav-item">
            <a class="f-nav-link" data-bs-toggle="tab"
               data-bs-target="#tab-issuer">Issuer Split</a>
        </li>
        <li class="nav-item">
            <a class="f-nav-link" data-bs-toggle="tab"
               data-bs-target="#tab-dates">Salient Dates</a>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">

        <!-- Tab 1 – Equity Exposure -->
        <div class="tab-pane fade show active" id="tab-equity-exposure" role="tabpanel">
            <br>
            <span id="equity_exposure_table"></span>
        </div>

        <!-- Tab 2 – Cover -->
        <div class="tab-pane fade" id="tab-cover" role="tabpanel">
            <br>
            <span id="cover_table"></span>
        </div>

        <!-- Tab 3 – Alpha Expectations -->
        <div class="tab-pane fade" id="tab-alpha" role="tabpanel">
            <br>
            <span id="alpha_table"></span>
        </div>

        <!-- Tab 4 – Issuer Split -->
        <div class="tab-pane fade" id="tab-issuer" role="tabpanel">
            <br>
            <span id="issuer_table"></span>
        </div>

        <!-- Tab 5 – Salient Dates -->
        <div class="tab-pane fade" id="tab-dates" role="tabpanel">
            <br>
            <span id="dates_table"></span>
        </div>

    </div>
</div>

<!-- ── Fund Detail Modal ──────────────────────────────────────────────── -->
<div class="modal fade" id="fundModal" tabindex="-1"
     aria-labelledby="fundModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h5 class="modal-title mb-0" id="fundModalTitle"></h5>
                    <small class="text-muted" id="fundModalSubtitle"></small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>

            <div class="modal-body" id="fundModalBody"></div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>

<script>

// ── Bar render helpers ────────────────────────────────────────────────

function barRender(bgColor, borderColor) {
    return function(data, type) {
        if (type === 'display') {
            var value  = parseFloat(data) || 0;
            var barPct = Math.min(Math.abs(value), 100).toFixed(2);
            return '<div class="bar-cell">'
                 +   '<div class="bar-fill" style="width:' + barPct + '%;'
                 +     'background:' + bgColor + ';'
                 +     'border-right:2px solid ' + borderColor + ';"></div>'
                 +   '<span class="bar-label">' + value.toFixed(1) + '%</span>'
                 + '</div>';
        }
        return data;
    };
}

var MODAL_BAR_COLORS = {
    4:  { bg: 'rgba(198,54,99,0.40)',   border: 'rgba(198,54,99,0.55)'  },  // Equity Exposure – Crimson
    6:  { bg: 'rgba(0,148,213,0.45)',   border: 'rgba(0,148,213,0.60)'  },  // Futures          – Blue
    7:  { bg: 'rgba(229,85,79,0.40)',   border: 'rgba(229,85,79,0.55)'  },  // TRS              – Red
    8:  { bg: 'rgba(0,143,82,0.40)',    border: 'rgba(0,143,82,0.55)'   },  // ELN              – Green
    9:  { bg: 'rgba(187,179,35,0.55)',  border: 'rgba(187,179,35,0.65)' }   // Physical         – Olive
};

// ── Fund detail modal ─────────────────────────────────────────────────

function populateFundModal(rowData, columns) {

    function val(i) {
        var col = columns[i];
        if (!col) return '';
        return (col.data !== undefined && rowData[col.data] !== undefined)
            ? rowData[col.data]
            : rowData[i];
    }

    $('#fundModalTitle').text(val(0));
    $('#fundModalSubtitle').text(val(1));

    var html     = '';
    var strategy = rowData.Strategy  || '';
    var date     = rowData.Datestamp || '';
    var fundSize = parseFloat(val(3));

    html += '<div class="d-flex flex-wrap gap-3 mb-3 pb-3 border-bottom">';
    if (strategy) html += '<div><span class="text-muted small">Strategy</span><br><strong>' + strategy + '</strong></div>';
    if (date)     html += '<div><span class="text-muted small">Date</span><br><strong>' + date + '</strong></div>';
    if (fundSize) html += '<div><span class="text-muted small">' + (columns[3] ? columns[3].title : 'Fund Size') + '</span>'
                        + '<br><strong>' + fundSize.toLocaleString('en-US', {maximumFractionDigits: 0}) + '</strong></div>';
    html += '</div>';

    html += '<h6 class="mb-2 text-muted" style="font-size:0.78rem;text-transform:uppercase;letter-spacing:.05em;">Equity Exposures</h6>';
    html += '<div class="fund-modal-metrics">';

    [4, 5, 6, 7, 8, 9, 10].forEach(function(i) {
        if (!columns[i]) return;
        var pct    = parseFloat(val(i)) || 0;
        var colors = MODAL_BAR_COLORS[i];
        var barPct = Math.min(Math.abs(pct), 100).toFixed(2);

        html += '<div class="fund-modal-metric-row">';
        html +=   '<div class="fund-modal-metric-label">' + columns[i].title + '</div>';
        html +=   '<div class="fund-modal-bar-wrap">';
        if (colors) {
            html += '<div class="fund-modal-bar-fill" style="width:' + barPct + '%;'
                  + 'background:' + colors.bg + ';border-right:2px solid ' + colors.border + ';"></div>';
        }
        html +=     '<span class="fund-modal-bar-value">' + pct.toFixed(1) + '%</span>';
        html +=   '</div>';
        html += '</div>';
    });

    html += '</div>';
    $('#fundModalBody').html(html);
}

// ── DataTable builder (unchanged) ────────────────────────────────────

function make_data_table(tableId, columns, table_data) {

    const table_id = '#' + tableId;

    if ($.fn.DataTable.isDataTable(table_id)) {
        $(table_id).DataTable().destroy();
        $(table_id).empty();
    }

    var thead = '<thead><tr>';
    columns.forEach(function(column) {
        thead += '<th>' + column.title + '</th>';
    });
    thead += '</tr></thead>';
    $(table_id).append(thead);

    $(table_id).DataTable({

        data: table_data,
        columns: columns,
        pageLength: 10,
        lengthMenu: [10, 25, 50, 100],
        select: true,
        paging: false,
        searching: false,
        info: false,
        ordering: false,

        columnDefs: [
            {
                targets: [0],
                render: function(data, type) {
                    if (type === 'display')
                        return '<span class="fund-link">' + data + '</span>';
                    return data;
                }
            },
            {
                targets: [3],
                className: "dt-right",
                render: $.fn.dataTable.render.number(',', '.', 0, '', '')
            },
            {
                targets: [4], width: "10%", className: "text-center",
                render: barRender('rgba(198,54,99,0.40)', 'rgba(198,54,99,0.55)')
            },
            {
                targets: [5], width: "10%", className: "text-center",
                render: function(data, type) {
                    if (type === 'display') return (parseFloat(data) || 0).toFixed(1) + '%';
                    return data;
                }
            },
            {
                targets: [6], width: "10%", className: "text-center",
                render: barRender('rgba(0,148,213,0.45)', 'rgba(0,148,213,0.60)')
            },
            {
                targets: [7], width: "10%", className: "text-center",
                render: barRender('rgba(229,85,79,0.40)', 'rgba(229,85,79,0.55)')
            },
            {
                targets: [8], width: "10%", className: "text-center",
                render: barRender('rgba(0,143,82,0.40)', 'rgba(0,143,82,0.55)')
            },
            {
                targets: [9], width: "10%", className: "text-center",
                render: barRender('rgba(187,179,35,0.55)', 'rgba(187,179,35,0.65)')
            },
            {
                targets: [10], width: "10%", className: "text-center",
                render: function(data, type) {
                    if (type === 'display') return (parseFloat(data) || 0).toFixed(1) + '%';
                    return data;
                }
            },
            { targets: [11, 12], visible: false },
            { targets: [1], width: "40%" }
        ]

    });

    $(table_id + ' tbody').on('click', '.fund-link', function() {
        var dt      = $(table_id).DataTable();
        var rowData = dt.row($(this).closest('tr')).data();
        populateFundModal(rowData, columns);
        $('#fundModal').modal('show');
    });
}

// ── Per-tab data loaders ──────────────────────────────────────────────

function load_equity_exposure() {
    var container = document.getElementById('equity_exposure_table');
    container.innerHTML = '';

    var val_date = document.getElementById("valuation_date").value;
    var url = '/fast/equities/equity-beta-positioning?val_date=' + val_date + '&output=json';

    $.getJSON(url, function(data) {
        var tableData    = data.data;
        var tableColumns = data.columns;

        for (const [tableName, subTableData] of Object.entries(tableData)) {
            var tableId  = tableName.replace(/\s/g, '_');
            var date     = subTableData[0].Datestamp;
            var strategy = subTableData[0].Strategy;

            container.insertAdjacentHTML('beforeend',
                '<br>'
              + '<div class="positioning-header">'
              +   '<p class="prime-h3">' + strategy + '</p>'
              +   '<p class="prime-h3">' + date + '</p>'
              + '</div>'
              + '<table id="' + tableId + '" class="table prime-datatable"></table>'
            );

            make_data_table(tableId, tableColumns, subTableData);
        }
    }).always(function() {
        $('#modal_loading').modal('hide');
    });
}

function load_cover() {
    var container = document.getElementById('cover_table');
    container.innerHTML = '';
    var val_date = document.getElementById("valuation_date").value;

    // TODO: replace URL with the cover endpoint
    // var url = '/fast/equities/equity-cover?val_date=' + val_date + '&output=json';
    // $.getJSON(url, function(data) { ... }).always(...);

    container.innerHTML = '<p class="text-muted mt-3">Cover — connect API endpoint here.</p>';
    $('#modal_loading').modal('hide');
}

function load_alpha() {
    var container = document.getElementById('alpha_table');
    container.innerHTML = '';
    var val_date = document.getElementById("valuation_date").value;

    // TODO: replace URL with the alpha expectations endpoint
    // var url = '/fast/equities/equity-alpha?val_date=' + val_date + '&output=json';
    // $.getJSON(url, function(data) { ... }).always(...);

    container.innerHTML = '<p class="text-muted mt-3">Alpha Expectations — connect API endpoint here.</p>';

}

function load_issuer() {
    var container = document.getElementById('issuer_table');
    container.innerHTML = '';
    var val_date = document.getElementById("valuation_date").value;

    // TODO: replace URL with the issuer split endpoint
    // var url = '/fast/equities/equity-issuer-split?val_date=' + val_date + '&output=json';
    // $.getJSON(url, function(data) { ... }).always(...);

    container.innerHTML = '<p class="text-muted mt-3">Issuer Split — connect API endpoint here.</p>';
    $('#modal_loading').modal('hide');
}

function load_dates() {
    var container = document.getElementById('dates_table');
    container.innerHTML = '';
    var val_date = document.getElementById("valuation_date").value;

    // TODO: replace URL with the salient dates endpoint
    // var url = '/fast/equities/equity-salient-dates?val_date=' + val_date + '&output=json';
    // $.getJSON(url, function(data) { ... }).always(...);

    container.innerHTML = '<p class="text-muted mt-3">Salient Dates — connect API endpoint here.</p>';
    $('#modal_loading').modal('hide');
}

// Map tab target IDs → loader functions
var TAB_LOADERS = {
    '#tab-equity-exposure': load_equity_exposure,
    '#tab-cover':           load_cover,
    '#tab-alpha':           load_alpha,
    '#tab-issuer':          load_issuer,
    '#tab-dates':           load_dates
};

// Called when the date picker changes – reloads whichever tab is active
function reloadActiveTab() {
    var activeTarget = $('#mainTabs .f-nav-link.active').attr('data-bs-target');
    if (!activeTarget) activeTarget = '#tab-equity-exposure';
    $('#modal_loading').modal('show');
    TAB_LOADERS[activeTarget]();
}

// ── Boot ─────────────────────────────────────────────────────────────

$(document).ready(function() {

    // Restore last-visited tab (falls back to Equity Exposure)
    var lastTab = localStorage.getItem('lastEquityTab');
    if (lastTab && TAB_LOADERS[lastTab]) {
        $('#mainTabs [data-bs-target="' + lastTab + '"]').tab('show');
    }

    // Load data whenever a tab becomes visible
    $('#mainTabs a[data-bs-toggle="tab"]').on('shown.bs.tab', function(e) {
        var target = $(e.target).attr('data-bs-target');
        localStorage.setItem('lastEquityTab', target);
        $('#modal_loading').modal('show');
        TAB_LOADERS[target]();
        // Re-adjust any visible DataTable columns
        $($.fn.dataTable.tables(true)).DataTable().columns.adjust();
    });

    // Initial load for the active tab
    $('#modal_loading').modal('show');
    var initial = localStorage.getItem('lastEquityTab') || '#tab-equity-exposure';
    TAB_LOADERS[initial]();

});

</script>

{% endblock %}
